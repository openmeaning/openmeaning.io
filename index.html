<style>
  :root {
    --paper: #FFFFFF;
    --ink: #0B1527;
    --slate: #5A6478;
    --line: #E4E8EF;
    --focus: #0B6DF0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0B1527;
      --ink: #EEF2F8;
      --slate: #9AA6BA;
      --line: #22304A;
      --focus: #5C9DFF;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  a { color: inherit; }
  a:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 4px;
    border-radius: 999px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 20px 48px;
  }

  /* The mark: three facets that come together once, on load */
  .mark {
    position: relative;
    width: clamp(132px, 22vw, 200px);
    aspect-ratio: 512 / 517;
    margin-bottom: clamp(28px, 4vw, 40px);
  }
  .mark img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    animation: settle 1.1s cubic-bezier(.2, .8, .2, 1) forwards;
  }
  .mark .blue   { --from: translate(0, -22%);   animation-delay: .15s; }
  .mark .yellow { --from: translate(-20%, 14%); animation-delay: .3s; }
  .mark .green  { --from: translate(20%, 14%);  animation-delay: .45s; }
  @keyframes settle {
    from { opacity: 0; transform: var(--from); }
    to   { opacity: 1; transform: translate(0, 0); }
  }

  h1 {
    margin: 0;
    font-weight: 600;
    font-size: clamp(48px, 9vw, 112px);
    line-height: 1;
    letter-spacing: -0.035em;
    opacity: 0;
    animation: rise .8s ease .9s forwards;
  }
  h1 sup {
    font-size: .2em;
    font-weight: 600;
    letter-spacing: 0;
    vertical-align: top;
    position: relative;
    top: .3em;
    margin-left: .1em;
  }
  .soon {
    margin: 18px 0 40px;
    font-size: clamp(19px, 2vw, 24px);
    color: var(--slate);
    opacity: 0;
    animation: rise .8s ease 1.1s forwards;
  }
  .button {
    display: inline-flex;
    align-items: center;
    padding: 13px 26px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font: inherit;
    font-size: 17px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color .15s ease, color .15s ease;
    opacity: 0;
    animation: rise .8s ease 1.3s forwards;
  }
  .button:hover { background: transparent; color: var(--ink); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark img, h1, .soon, .button { animation: none; opacity: 1; transform: none; }
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 22px 20px 28px;
    font-size: 15px;
    color: var(--slate);
  }
  footer .inner {
    width: min(1080px, 100%);
    margin-inline: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 24px;
  }
  footer a { text-underline-offset: 3px; }
  footer a:hover { color: var(--ink); }
</style>
</head>
